server {
    listen 80;
    server_name mazuhi.com www.mazuhi.com;
    
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mazuhi.com www.mazuhi.com;

    ssl_certificate /etc/letsencrypt/live/mazuhi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mazuhi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Define MIME types for Next.js static assets
    types {
        application/javascript js mjs;
        text/css css;
        image/x-icon ico;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg svgz;
        image/webp webp;
        application/json json;
        font/woff woff;
        font/woff2 woff2;
    }

    # Serve Next.js static files with correct MIME types
    location /_next/static/ {
        alias /var/www/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Serve public files
    location /public/ {
        alias /var/www/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location /images/ {
        alias /var/www/public/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Manifest file
    location = /manifest.json {
        proxy_pass http://localhost:3000;
        add_header Content-Type "application/manifest+json";
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Proxy to Next.js for everything else
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Logging
    access_log /var/log/nginx/mazuhi_access.log;
    error_log /var/log/nginx/mazuhi_error.log;
}