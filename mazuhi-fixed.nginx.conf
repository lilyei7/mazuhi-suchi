upstream nextjs_backend {
    server localhost:3000;
}

server {
    listen 80;
    server_name mazuhi.com www.mazuhi.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mazuhi.com www.mazuhi.com;

    # SSL configuration
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Client body size limit
    client_max_body_size 10m;

    # Logging
    access_log /var/log/nginx/mazuhi_access.log;
    error_log /var/log/nginx/mazuhi_error.log;

    # Cache busted static assets (1 year)
    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        proxy_cache_valid 200 1y;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "public, immutable";
        
        # Explicitly set MIME types for static assets
        location ~* \.js$ {
            proxy_pass http://nextjs_backend;
            add_header Content-Type "application/javascript; charset=utf-8" always;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
        }
        
        location ~* \.css$ {
            proxy_pass http://nextjs_backend;
            add_header Content-Type "text/css; charset=utf-8" always;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
        }
        
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            proxy_pass http://nextjs_backend;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
        }
    }

    # Public static files
    location /public/ {
        proxy_pass http://nextjs_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images directory
    location /images/ {
        proxy_pass http://nextjs_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker
    location = /sw.js {
        proxy_pass http://nextjs_backend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/javascript; charset=utf-8";
    }

    # API routes
    location /api/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Manifest and other static files at root
    location = /manifest.json {
        proxy_pass http://nextjs_backend;
        add_header Content-Type "application/manifest+json";
    }

    location = /favicon.ico {
        proxy_pass http://nextjs_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /robots.txt {
        proxy_pass http://nextjs_backend;
        add_header Content-Type "text/plain";
    }

    # Main Next.js application
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_cache_bypass $http_upgrade;
        
        # Buffer settings for better performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}